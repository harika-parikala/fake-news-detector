<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fake News Detector</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; margin: 0; padding: 30px; }
    .box { max-width: 700px; margin: auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h1 { margin-top: 0; }
    textarea { width: 100%; height: 180px; padding: 10px; font-size: 15px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 24px; font-size: 16px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .result { margin-top: 20px; padding: 16px; border-radius: 8px; font-size: 20px; }
    .Real { background: #dcfce7; color: #166534; }
    .Fake { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="box">
    <h1>📰 Fake News Detector</h1>
    <form method="POST">
      <textarea name="news" placeholder="Paste a news headline or article here..." required>{{ text }}</textarea>
      <button type="submit">Check</button>
    </form>
    {% if result %}
      <div class="result {{ result.label }}">
        Result: <b>{{ result.label }}</b> (confidence: {{ result.confidence }}%)
      </div>
    {% endif %}
  </div>
</body>
</html>
